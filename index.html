<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cofre de Ofertas</title>
<meta name="theme-color" content="#2940C4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EDEFEA; --surface:#FBFCF9; --surface2:#E4E7E0; --surface3:#F2F4EF; --ink:#161B24; --muted:#59616F; --faint:#858C97;
  --line:#D6DAD2; --line2:#BFC5BA;
  --accent:#2940C4; --accent-ink:#FFFFFF; --accent-soft:#E2E6FA; --danger:#B42318;
  --s-ativa:#16834F; --s-testada:#7248BD; --s-andamento:#A86200; --s-projeto:#1F72A6; --s-segundo:#747A84;
  --scrim:rgba(14,18,26,.36);
  --shadow:0 1px 0 rgba(22,27,36,.04), 0 8px 24px -14px rgba(22,27,36,.22);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1116; --surface:#171B22; --surface2:#12151B; --surface3:#1D222B; --ink:#E7EAEE; --muted:#9AA2AE; --faint:#6E7682;
    --line:#272D37; --line2:#3A424F;
    --accent:#8C9DFF; --accent-ink:#0E1116; --accent-soft:#1F2647; --danger:#FF7B6C;
    --s-ativa:#3CC585; --s-testada:#AC8FF2; --s-andamento:#EFA33A; --s-projeto:#5DB3E8; --s-segundo:#9CA2AC;
    --scrim:rgba(0,0,0,.55);
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1116; --surface:#171B22; --surface2:#12151B; --surface3:#1D222B; --ink:#E7EAEE; --muted:#9AA2AE; --faint:#6E7682;
  --line:#272D37; --line2:#3A424F;
  --accent:#8C9DFF; --accent-ink:#0E1116; --accent-soft:#1F2647; --danger:#FF7B6C;
  --s-ativa:#3CC585; --s-testada:#AC8FF2; --s-andamento:#EFA33A; --s-projeto:#5DB3E8; --s-segundo:#9CA2AC;
  --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink);margin:0}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ================= casca do app ================= */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface2);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:22px;padding:18px 12px 16px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px}
.mark{width:30px;height:30px;border-radius:8px;background:var(--ink);position:relative;flex:none}
.mark::before{content:"";position:absolute;inset:8px;border-radius:50%;border:2px solid var(--bg)}
.mark::after{content:"";position:absolute;left:50%;top:5px;width:2px;height:6px;margin-left:-1px;background:var(--bg);border-radius:1px}
.brand b{font:700 18px/1.1 var(--f-display);letter-spacing:-.02em;display:block}
.brand small{font:11px var(--f-mono);color:var(--faint);letter-spacing:.02em}
.nav{display:grid;gap:2px}
.nav-cap{font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.12em;color:var(--faint);padding:14px 10px 6px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:9px;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:14px;cursor:pointer;text-align:left}
.nav-item:hover{color:var(--ink);background:color-mix(in srgb,var(--surface) 60%,transparent)}
.nav-item .n{margin-left:auto;font:500 12px var(--f-mono);color:var(--faint);font-variant-numeric:tabular-nums}
.nav-item[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.nav-item[aria-current="true"] .ic{color:var(--accent)}
.nav-item .dot{width:8px;height:8px;border-radius:50%;background:var(--st);margin:0 5px;flex:none}
.nav-item.sub{font-weight:500;font-size:13.5px;padding:7px 10px}
.side-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line)}

.main{min-width:0;padding-inline:clamp(16px,3vw,40px);padding-block:0 72px}
.appbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;flex-wrap:wrap;gap:12px 16px;padding-block:16px 14px;margin-bottom:20px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.appbar .mark{display:none;width:28px;height:28px}
.ab-title{min-width:0;margin-right:auto}
.ab-title h1{font:700 25px/1.15 var(--f-display);letter-spacing:-.025em;margin:0;text-wrap:balance}
.ab-title p{margin:1px 0 0;font-size:13px;color:var(--muted)}
.search{position:relative;flex:0 1 320px;min-width:0}
.search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint);width:17px;height:17px;pointer-events:none}
.search .input{padding-left:36px}
.ab-sync{display:none}

.sync{display:flex;align-items:center;gap:7px;font:12px var(--f-mono);color:var(--muted);white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.sync[data-s="ok"] i{background:var(--s-ativa)}
.sync[data-s="busy"] i{background:var(--s-andamento)}
.sync[data-s="erro"] i{background:var(--danger)}
.sync[data-s="local"] i{background:var(--s-projeto)}

.chips{display:none;gap:6px;overflow-x:auto;margin:-6px 0 16px;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;color:var(--muted);cursor:pointer}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--st)}
.chip .n{font:500 12px var(--f-mono);color:var(--faint)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] .n{color:color-mix(in srgb,var(--bg) 70%,var(--ink))}

.bottombar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;grid-template-columns:1fr auto 1fr;align-items:end;background:var(--surface);border-top:1px solid var(--line);padding:4px 24px calc(6px + env(safe-area-inset-bottom))}
.bb-item{display:grid;justify-items:center;gap:1px;font-size:11.5px;font-weight:600;color:var(--faint);background:none;border:0;padding:6px 4px;cursor:pointer}
.bb-item .ic{width:23px;height:23px}
.bb-item[aria-current="true"]{color:var(--accent)}
.bb-fab{width:56px;height:56px;border-radius:18px;background:var(--accent);color:var(--accent-ink);border:0;display:grid;place-items:center;box-shadow:0 10px 24px -10px var(--accent);transform:translateY(-14px);cursor:pointer}
.bb-fab .ic{width:26px;height:26px;stroke-width:2.2}

@media (max-width:880px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .main{padding-block:0 110px}
  .appbar{padding-block:12px 12px;margin-bottom:18px}
  .appbar .mark{display:block}
  .ab-title h1{font-size:21px}
  .ab-sync{display:flex}
  .search{flex:1 1 100%;order:3}
  #acao-principal{display:none}
  .chips{display:flex}
  .bottombar{display:grid}
}

/* ================= controles ================= */
.input{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;min-width:0}
.input::placeholder{color:var(--faint)}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:14px;border-radius:10px;padding:9px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--line2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.add{justify-self:start;background:transparent;border-style:dashed;border-color:var(--line2);color:var(--accent);font-size:13px;padding:7px 12px}
.btn.danger{background:transparent;color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,transparent);font-size:13px;padding:7px 12px}
.btn.danger.armed{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.icon-btn{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;border:0;background:transparent;color:var(--muted);cursor:pointer;flex:none}
.icon-btn:hover{background:var(--surface3);color:var(--ink)}
.icon-btn .ic{width:21px;height:21px}

/* ================= fichas ================= */
.grupo{--st:var(--ink);margin-top:28px}
.grupo:first-child{margin-top:0}
.grupo>header{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin-bottom:12px}
.grupo h2{font:650 17px var(--f-display);letter-spacing:-.015em;margin:0;display:flex;align-items:center;gap:9px}
.grupo h2 i{width:10px;height:10px;border-radius:3px;background:var(--st)}
.grupo .n{font:500 13px var(--f-mono);color:var(--faint)}
.grupo .h{font-size:13px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:12px}

.card{--stub:116px;position:relative;display:grid;grid-template-columns:minmax(0,1fr) var(--stub);background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:border-color .15s,transform .15s,box-shadow .15s}
.card:hover{border-color:var(--line2);transform:translateY(-1px);box-shadow:var(--shadow)}
.card:active{transform:scale(.995)}
.card::before,.card::after{content:"";position:absolute;right:var(--stub);width:14px;height:14px;border-radius:50%;background:var(--bg);border:1px solid var(--line);transform:translateX(50%);z-index:1}
.card::before{top:-8px}.card::after{bottom:-8px}
.card-main{padding:14px 16px;display:grid;gap:7px;align-content:start;min-width:0}
.nicho{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);overflow-wrap:anywhere}
.card h3{font:650 17px/1.25 var(--f-display);letter-spacing:-.01em;margin:0;overflow-wrap:anywhere;text-wrap:balance}
.card h3.sem{color:var(--faint);font-style:italic;font-weight:500}
.resumo{margin:0;color:var(--muted);font-size:13.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.kv{display:flex;flex-wrap:wrap;gap:6px}
.kv span{font-size:12px;background:var(--surface3);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv b{font:600 12px var(--f-mono);color:var(--ink);font-variant-numeric:tabular-nums}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;font:12px var(--f-mono);color:var(--faint)}
.meta span{display:inline-flex;align-items:center;gap:4px}
.meta .ic{width:14px;height:14px}
.stub{border-left:1.5px dashed var(--line2);padding:14px 12px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;gap:10px;text-align:right;background:color-mix(in srgb,var(--st) 6%,var(--surface))}
.stub .lbl{font:500 10px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.preco{font:600 20px/1.1 var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.preco small{font-size:11px;font-weight:500;color:var(--muted);margin-right:3px}
.preco.vazio{color:var(--faint);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:5px;font-weight:600;font-size:11.5px;line-height:1.2;color:var(--st);background:color-mix(in srgb,var(--st) 14%,transparent);padding:3px 8px;border-radius:99px}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}

.aviso{border:1px dashed var(--line2);border-radius:16px;padding:32px clamp(18px,4vw,40px);display:grid;gap:10px;justify-items:start;max-width:720px}
.aviso h2{font:650 21px/1.25 var(--f-display);letter-spacing:-.015em;margin:0;text-wrap:balance}
.aviso p{margin:0;color:var(--muted);max-width:60ch}
.poucos{color:var(--muted);font-size:14px;margin:0;padding:6px 0 14px}

/* ================= ficha aberta ================= */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.drawer{--st:var(--accent);position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--bg);border-left:1px solid var(--line);z-index:50;display:flex;flex-direction:column;box-shadow:-24px 0 60px -30px rgba(0,0,0,.4);animation:entra .22s ease-out}
@keyframes entra{from{transform:translateX(32px);opacity:.5}}
.dr-top{display:flex;align-items:center;gap:8px;padding:8px 14px 8px 6px;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:inset 0 3px 0 var(--st)}
.dr-top .dr-t{min-width:0;flex:1;font:650 15px var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .15s}
.drawer.rolou .dr-t{opacity:1}
.dr-scroll{overflow-y:auto;flex:1;overscroll-behavior:contain}
.dr-inner{padding:26px clamp(16px,4.5vw,40px) 64px;display:grid;gap:22px}
.f-nome{font:700 30px/1.15 var(--f-display);letter-spacing:-.025em;border:0;background:transparent;resize:none;width:100%;padding:0;overflow:hidden;outline:none;display:block}
.f-nome::placeholder{color:var(--faint)}
.st-bloco{display:grid;gap:8px}
.st-pick{display:flex;flex-wrap:wrap;gap:6px}
.st-pick button{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:13px;padding:6px 12px 6px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.st-pick button:hover{border-color:var(--st);color:var(--ink)}
.st-pick i{width:8px;height:8px;border-radius:50%;background:var(--st)}
.st-pick button[aria-checked="true"]{background:var(--st);border-color:var(--st);color:var(--surface)}
.st-pick button[aria-checked="true"] i{background:var(--surface)}
.st-hint{margin:0;font-size:13px;color:var(--muted)}
.fields{display:grid;grid-template-columns:1.6fr 1fr 1.3fr;gap:12px}
.field{display:grid;gap:5px;align-content:start;min-width:0}
.field>label,.cap{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.blk{display:grid;gap:10px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.blk>header{display:flex;align-items:center;gap:9px}
.blk>header .ic{color:var(--st);width:19px;height:19px}
.blk h3{font:650 16px var(--f-display);letter-spacing:-.01em;margin:0}
.blk .n{font:500 12px var(--f-mono);color:var(--faint)}
.blk .sub{margin:-4px 0 0;font-size:13px;color:var(--muted)}
.blk .input{background:var(--bg)}
.links{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.comgo{position:relative}
.comgo .input{padding-right:72px}
.go{position:absolute;right:5px;top:50%;transform:translateY(-50%);font-weight:600;font-size:12px;color:var(--accent);text-decoration:none;padding:4px 8px;border-radius:6px;background:var(--accent-soft);white-space:nowrap}
.vids,.dados{display:grid;gap:8px}
.vid{display:grid;grid-template-columns:92px minmax(0,1fr) minmax(0,1.25fr) 58px 34px;gap:8px;align-items:center}
.plat{font:600 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface3);border:1px solid var(--line);border-radius:8px;padding:9px 4px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plat.vazio{color:var(--faint);border-style:dashed;background:transparent}
.go-s{font-weight:600;font-size:12px;color:var(--accent);text-decoration:none;padding:8px 0;border-radius:8px;background:var(--accent-soft);text-align:center}
.go-s[hidden]{display:block!important;visibility:hidden}
.x{width:34px;height:34px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--faint);cursor:pointer;font-size:19px;line-height:1}
.x:hover{color:var(--danger);border-color:var(--line)}
.dado{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 34px;gap:8px;align-items:center}
.sugs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sugs .cap{margin-right:2px}
.sug{font-weight:500;font-size:12.5px;border:1px dashed var(--line2);background:transparent;color:var(--muted);padding:4px 10px;border-radius:99px;cursor:pointer}
.sug:hover{color:var(--accent);border-color:var(--accent)}
.vazio-linha{margin:0;font-size:13.5px;color:var(--faint)}
.f-info{min-height:220px;resize:vertical;line-height:1.6}
.dr-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-top:4px;font:12px var(--f-mono);color:var(--faint)}
@media (max-width:640px){
  .drawer{border-left:0}
  .f-nome{font-size:25px}
  .fields,.links{grid-template-columns:1fr}
  .blk{padding:14px 12px}
  .vid{grid-template-columns:minmax(0,1fr) 58px 34px;grid-template-areas:"t g x" "u u u";row-gap:6px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
  .vid .t{grid-area:t}.vid .go-s{grid-area:g}.vid .x{grid-area:x}.vid .plat{display:none}.vid .u{grid-area:u}
}

/* ================= ideias ================= */
.composer{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px 12px;display:grid;gap:6px;margin-bottom:22px;box-shadow:var(--shadow)}
.composer input{border:0;background:transparent;font:650 18px/1.3 var(--f-display);letter-spacing:-.01em;outline:none;padding:0;width:100%}
.composer textarea{border:0;background:transparent;resize:none;min-height:64px;font-size:15.5px;line-height:1.55;outline:none;width:100%;overflow:hidden;padding:0}
.composer ::placeholder{color:var(--faint)}
.composer .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.dica{font:12px var(--f-mono);color:var(--faint)}
kbd{font:11px var(--f-mono);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted)}
.notas{columns:3 280px;column-gap:12px}
.nota{break-inside:avoid;margin-bottom:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px 6px;display:grid;gap:6px}
.nota.fix{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.nota .fixo{display:inline-flex;align-items:center;gap:4px;font:500 10px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.nota .fixo .ic{width:12px;height:12px}
.nota input{border:0;background:transparent;font:650 16.5px/1.3 var(--f-display);letter-spacing:-.01em;outline:none;padding:0;width:100%}
.nota input::placeholder,.nota textarea::placeholder{color:var(--faint)}
.nota textarea{--lh:1.6em;border:0;resize:none;width:100%;padding:0;outline:none;overflow:hidden;font-size:14.5px;line-height:var(--lh);min-height:var(--lh);background:transparent;background-image:linear-gradient(to bottom,transparent calc(var(--lh) - 1px),var(--line) calc(var(--lh) - 1px),var(--line) var(--lh));background-size:100% var(--lh);background-attachment:local}

<script>
(() => {
"use strict";

const STATUS = [
  { k:"ativa",     label:"Ativa",         grupo:"Ativas",        hint:"No ar e vendendo agora" },
  { k:"testada",   label:"Testada",       grupo:"Testadas",      hint:"Já rodou — tem resultado pra consultar" },
  { k:"andamento", label:"Em andamento",  grupo:"Em andamento",  hint:"Montando produto, página e criativos" },
  { k:"projeto",   label:"Em projeto",    grupo:"Em projeto",    hint:"Ainda no papel" },
  { k:"segundo",   label:"Segundo plano", grupo:"Segundo plano", hint:"Pausada, fica pra depois" },
];
const ST = Object.fromEntries(STATUS.map(s => [s.k, s]));
const SUGESTOES = ["Investimento","Faturamento","Vendas","ROAS","CPA","CTR","Conversão da página","Ticket médio","Order bump","Reembolsos"];
const LINKS = [
  { f:"pagina",     label:"Página de vendas",      ph:"https://…" },
  { f:"checkout",   label:"Checkout",              ph:"https://…" },
  { f:"referencia", label:"Oferta de referência",  ph:"Biblioteca de anúncios, concorrente…" },
  { f:"entrega",    label:"Entregável",            ph:"Drive, área de membros, app…" },
];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ic = n => `<svg class="ic" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const agora = () => new Date().toISOString();
const norm = s => String(s ?? "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const semId = o => { const { id, ...r } = o; return r; };
const statusDe = o => ST[o.status] ? o.status : "projeto";
const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch {} },
};

/* ---------------- estado ---------------- */
const S = { ofertas: new Map(), ideias: new Map() };
const carregado = { ofertas:false, ideias:false };
let db = null, modo = "carregando", ultimoErro = null;
let aba = store.get("cofre.aba") === "ideias" ? "ideias" : "ofertas";
let filtro = "todas";
const busca = { ofertas:"", ideias:"" };
let edit = null, focoAntes = null, notasPendentes = false;

/* ---------------- gravação ---------------- */
const timers = new Map(), pend = new Map(), voando = new Set();
const chave = (col, id) => col + "/" + id;
const ocupado = (col, id) => { const k = chave(col, id); return timers.has(k) || pend.has(k) || voando.has(k); };
const esperar = ms => new Promise(r => setTimeout(r, ms));

async function comRetry(fn){
  try { return await fn(); }
  catch (e) { if (e && e.code === "unavailable") { await esperar(400 + Math.random() * 700); return fn(); } throw e; }
}
function persistirLocal(col){ store.set("cofre." + col, JSON.stringify([...S[col].values()])); }
async function gravar(col, id, data){
  if (modo !== "db") { persistirLocal(col); return; }
  const ref = db.collection(col).doc(id);
  if (data === null) await comRetry(() => ref.delete());
  else await comRetry(() => ref.set(data));
}
function enfileirar(col, id, data){
  const k = chave(col, id);
  pend.set(k, { col, id, data });
  if (!voando.has(k)) descarregar(k);
}
async function descarregar(k){
  voando.add(k); atualizarSync();
  try {
    while (pend.has(k)) {
      const { col, id, data } = pend.get(k); pend.delete(k);
      await gravar(col, id, data);
      ultimoErro = null;
    }
  } catch (e) {
    ultimoErro = e || { code:"unavailable" };
  } finally {
    voando.delete(k); atualizarSync();
  }
}
function salvar(col, id, data, atraso = 550){
  data.atualizadoEm = agora();
  if (!data.criadoEm) data.criadoEm = data.atualizadoEm;
  S[col].set(id, { ...data, id });
  const k = chave(col, id);
  clearTimeout(timers.get(k));
  timers.set(k, setTimeout(() => {
    timers.delete(k);
    const atual = S[col].get(id);
    if (atual) enfileirar(col, id, semId(atual));
  }, atraso));
  atualizarSync(); renderLogo();
}
function salvarJa(col, id){
  const k = chave(col, id);
  if (!timers.has(k)) return;
  clearTimeout(timers.get(k)); timers.delete(k);
  const atual = S[col].get(id);
  if (atual) enfileirar(col, id, semId(atual));
}
function apagar(col, id){
  const k = chave(col, id);
  clearTimeout(timers.get(k)); timers.delete(k);
  S[col].delete(id);
  enfileirar(col, id, null);
  renderLogo();
}
function atualizarSync(){
  const busy = timers.size || pend.size || voando.size;
  let s, t;
  if (modo === "carregando") { s = "wait"; t = "Abrindo o cofre…"; }
  else if (ultimoErro && !busy) {
    s = "erro";
    t = ultimoErro.code === "quota_exceeded" ? "Cofre cheio — apague itens antigos" :
        ultimoErro.code === "revoked" ? "Sem acesso agora" : "Não salvou — edite de novo";
  }
  else if (busy) { s = "busy"; t = "Salvando…"; }
  else if (modo === "local") { s = "local"; t = "Salvo só neste navegador"; }
  else { s = "ok"; t = "Tudo salvo"; }
  document.querySelectorAll(".sync").forEach(el => { el.dataset.s = s; el.querySelector(".sync-txt").textContent = t; });
}

/* ---------------- formatação ---------------- */
function precoNum(s){
  let v = String(s ?? "").replace(/[^\d,.-]/g, "");
  if (!v) return null;
  if (v.includes(",")) v = v.replace(/\./g, "").replace(",", ".");
  const n = parseFloat(v);
  return isNaN(n) ? null : n;
}
function precoHtml(s){
  const n = precoNum(s);
  if (n === null) return s && String(s).trim() ? `<span class="preco">${esc(s)}</span>` : `<span class="preco vazio">—</span>`;
  return `<span class="preco"><small>R$</small>${n.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}</span>`;
}
function quando(iso, comHora){
  if (!iso) return "";
  const d = new Date(iso), h = new Date();
  const dia = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((dia(h) - dia(d)) / 864e5);
  const hora = d.toLocaleTimeString("pt-BR", { hour:"2-digit", minute:"2-digit" });
  if (diff === 0) return comHora ? "hoje, " + hora : "hoje";
  if (diff === 1) return comHora ? "ontem, " + hora : "ontem";
  const opt = { day:"numeric", month:"short" };
  if (d.getFullYear() !== h.getFullYear()) opt.year = "numeric";
  return d.toLocaleDateString("pt-BR", opt).replace(/\./g, "").replace(/ de /g, " ");
}
function linkSeguro(s){
  s = String(s ?? "").trim();
  if (!s) return "";
  if (!/^https?:\/\//i.test(s)) s = "https://" + s;
  try { const u = new URL(s); return /^https?:$/.test(u.protocol) && u.hostname.includes(".") ? u.href : ""; } catch { return ""; }
}
function plataforma(url){
  const u = norm(url);
  if (!u.trim()) return "";
  if (/youtu\.?be/.test(u)) return "YouTube";
  if (u.includes("instagram")) return "Instagram";
  if (u.includes("tiktok")) return "TikTok";
  if (u.includes("facebook.com/ads/library")) return "Biblioteca";
  if (u.includes("facebook") || u.includes("fb.watch")) return "Facebook";
  if (u.includes("drive.google")) return "Drive";
  if (u.includes("vimeo")) return "Vimeo";
  if (u.includes("kiwify")) return "Kiwify";
  if (u.includes("hotmart")) return "Hotmart";
  const seg = linkSeguro(url);
  if (!seg) return "Link";
  return new URL(seg).hostname.replace(/^www\./, "").split(".")[0];
}

/* ---------------- navegação ---------------- */
function renderNav(){
  const todas = [...S.ofertas.values()];
  const cont = { todas:todas.length, ideias:S.ideias.size };
  STATUS.forEach(s => cont[s.k] = todas.filter(o => statusDe(o) === s.k).length);

  $("#nav-status").innerHTML = STATUS.map(s => `
    <button class="nav-item sub" type="button" data-tab="ofertas" data-filtro="${s.k}" style="--st:var(--s-${s.k})"><span class="dot"></span>${esc(s.grupo)}<span class="n">${cont[s.k]}</span></button>`).join("");
  document.querySelectorAll("[data-conta]").forEach(el => el.textContent = cont[el.dataset.conta]);
  document.querySelectorAll(".nav-item").forEach(el => {
    const atual = el.dataset.tab === aba && (aba === "ideias" || el.dataset.filtro === filtro);
    el.setAttribute("aria-current", String(atual));
  });
  document.querySelectorAll(".bb-item").forEach(el => el.setAttribute("aria-current", String(el.dataset.tab === aba)));

  $("#chips").innerHTML = [{ k:"todas", grupo:"Todas", cor:"var(--accent)" }].concat(STATUS.map(s => ({ ...s, cor:`var(--s-${s.k})` })))
    .map(s => `<button class="chip" type="button" data-filtro="${s.k}" aria-pressed="${filtro === s.k}" style="--st:${s.cor}">${s.k === "todas" ? "" : "<i></i>"}${esc(s.grupo)}<span class="n">${cont[s.k]}</span></button>`).join("");

  let h1, sub;
  if (aba === "ideias") { h1 = "Ideias soltas"; sub = S.ideias.size ? `${S.ideias.size} ${S.ideias.size === 1 ? "anotação" : "anotações"} · o que amadurecer vira oferta` : "Anote antes que fuja"; }
  else if (filtro === "todas") { h1 = "Todas as ofertas"; sub = `${cont.todas} no cofre · ${cont.ativa} ${cont.ativa === 1 ? "ativa" : "ativas"}`; }
  else { h1 = ST[filtro].grupo; sub = ST[filtro].hint; }
  $("#ab-h1").textContent = h1;
  $("#ab-sub").textContent = sub;
  const bi = $("#busca");
  bi.placeholder = aba === "ideias" ? "Buscar nas ideias" : "Buscar por nome, nicho, dado ou anotação";
  if (bi.value !== busca[aba]) bi.value = busca[aba];
  $("#acao-principal span").textContent = aba === "ideias" ? "Nova ideia" : "Nova oferta";
  $("#fab").setAttribute("aria-label", aba === "ideias" ? "Nova ideia" : "Nova oferta");
}
function irPara(tab, f){
  aba = tab; store.set("cofre.aba", tab);
  if (tab === "ofertas" && f) filtro = f;
  $("#view-ofertas").hidden = tab !== "ofertas";
  $("#view-ideias").hidden = tab !== "ideias";
  renderTudo();
  window.scrollTo({ top:0 });
}
document.addEventListener("click", e => {
  const n = e.target.closest(".nav-item, .bb-item");
  if (n) { irPara(n.dataset.tab, n.dataset.filtro); return; }
  const c = e.target.closest(".chip");
  if (c) { filtro = c.dataset.filtro; renderTudo(); }
});
function acaoPrincipal(){
  if (aba === "ideias") { window.scrollTo({ top:0, behavior:"smooth" }); $("#c-titulo").focus(); }
  else novaOferta(filtro);
}
$("#acao-principal").addEventListener("click", acaoPrincipal);
$("#fab").addEventListener("click", acaoPrincipal);
$("#busca").addEventListener("input", e => { busca[aba] = e.target.value; aba === "ideias" ? renderNotas() : renderGrupos(); });

/* ---------------- ofertas: lista ---------------- */
const vazia = st => ({ nome:"", status:st, nicho:"", preco:"", formato:"", pagina:"", checkout:"", referencia:"", entrega:"", videos:[], dados:[], info:"" });

function filtradas(){
  const q = norm(busca.ofertas).trim();
  return [...S.ofertas.values()].filter(o => !q || norm([
    o.nome, o.nicho, o.formato, o.info, o.preco,
    (o.videos || []).map(v => v.titulo + " " + v.url).join(" "),
    (o.dados || []).map(d => d.rotulo + " " + d.valor).join(" "),
  ].join(" ")).includes(q));
}

function ficha(o){
  const st = ST[statusDe(o)];
  const dados = (o.dados || []).filter(d => (d.rotulo || "").trim() && (d.valor || "").trim()).slice(0, 3);
  const nv = (o.videos || []).filter(v => (v.url || "").trim()).length;
  const resumo = (o.info || "").trim().split("\n").find(l => l.trim()) || "";
  return `
  <article class="card" role="button" tabindex="0" data-abrir="${esc(o.id)}" style="--st:var(--s-${st.k})" aria-label="Abrir ${esc(o.nome || "oferta sem nome")}">
    <div class="card-main">
      ${o.nicho ? `<span class="nicho">${esc(o.nicho)}</span>` : ""}
      <h3 class="${o.nome ? "" : "sem"}">${esc(o.nome || "Sem nome")}</h3>
      ${resumo ? `<p class="resumo">${esc(resumo)}</p>` : ""}
      ${dados.length ? `<div class="kv">${dados.map(d => `<span>${esc(d.rotulo)} <b>${esc(d.valor)}</b></span>`).join("")}</div>` : ""}
      <div class="meta">
        <span>${ic("play")}${nv}</span>
        <span>${ic("grafico")}${(o.dados || []).filter(d => (d.valor || "").trim()).length}</span>
        <span>atualizada ${esc(quando(o.atualizadoEm))}</span>
      </div>
    </div>
    <div class="stub">
      <span class="lbl">ticket</span>
      ${precoHtml(o.preco)}
      <span class="pill"><i></i>${esc(st.label)}</span>
    </div>
  </article>`;
}

function renderGrupos(){
  const el = $("#grupos");
  if (!carregado.ofertas) { el.innerHTML = `<p class="poucos">Abrindo o cofre…</p>`; return; }
  if (!S.ofertas.size) {
    el.innerHTML = `
      <div class="aviso">
        <h2>O cofre ainda está vazio</h2>
        <p>Cadastre a primeira oferta — pode ser uma que já rodou, uma que está no ar agora ou só um rascunho. Cada uma guarda links, vídeos sobre o conteúdo, os números e suas anotações.</p>
        <button class="btn primary" type="button" data-acao="nova">${ic("mais")}Cadastrar a primeira oferta</button>
      </div>`;
    return;
  }
  const lista = filtradas(), q = busca.ofertas.trim();
  if (!lista.length && q) { el.innerHTML = `<p class="poucos">Nada encontrado para “${esc(q)}”.</p>`; return; }
  const grupos = filtro === "todas" ? STATUS : STATUS.filter(s => s.k === filtro);
  el.innerHTML = grupos.map(s => {
    const itens = lista.filter(o => statusDe(o) === s.k)
      .sort((a, b) => String(b.atualizadoEm).localeCompare(String(a.atualizadoEm)));
    if (!itens.length && filtro === "todas") return "";
    return `
    <section class="grupo" style="--st:var(--s-${s.k})">
      ${filtro === "todas" ? `<header><h2><i></i>${esc(s.grupo)}</h2><span class="n">${itens.length}</span><span class="h">${esc(s.hint)}</span></header>` : ""}
      ${itens.length ? `<div class="cards">${itens.map(ficha).join("")}</div>`
        : `<div class="aviso"><h2>Nenhuma oferta ${q ? "encontrada" : "marcada"} como “${esc(s.label)}”</h2><p>${esc(s.hint)}.</p><button class="btn primary" type="button" data-acao="nova">${ic("mais")}Nova oferta ${esc(s.label.toLowerCase())}</button></div>`}
    </section>`;
  }).join("");
}
$("#grupos").addEventListener("click", e => {
  if (e.target.closest("[data-acao='nova']")) { novaOferta(filtro); return; }
  const c = e.target.closest("[data-abrir]"); if (c) abrirOferta(c.dataset.abrir);
});
$("#grupos").addEventListener("keydown", e => {
  const c = e.target.closest("[data-abrir]");
  if (c && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); abrirOferta(c.dataset.abrir); }
});

/* ---------------- ofertas: ficha aberta ---------------- */
const dr = $("#drawer");

function paraEdicao(o){
  const d = structuredClone(semId(o));
  d.videos = Array.isArray(d.videos) ? d.videos.map(v => ({ titulo:v.titulo || "", url:v.url || "" })) : [];
  d.dados = Array.isArray(d.dados) ? d.dados.map(x => ({ rotulo:x.rotulo || "", valor:x.valor || "" })) : [];
  return { ...vazia("projeto"), ...d };
}
function abrirOferta(id){
  const o = S.ofertas.get(id);
  if (o) mostrarDrawer({ id, data:paraEdicao(o) });
}
function novaOferta(status){
  mostrarDrawer({ id:uid(), data:vazia(ST[status] ? status : "projeto") });
}
function mostrarDrawer(e){
  if (!edit) focoAntes = document.activeElement;
  edit = e;
  dr.hidden = false; $("#scrim").hidden = false;
  document.body.style.overflow = "hidden";
  renderDrawer();
  if (!edit.data.nome) $("#f-nome").focus(); else dr.querySelector("[data-acao='fechar']").focus();
}

function renderDrawer(manterScroll){
  if (!edit) return;
  const sc = dr.querySelector(".dr-scroll"), top = sc ? sc.scrollTop : 0;
  const o = edit.data, st = ST[statusDe(o)];
  const usados = new Set(o.dados.map(d => norm(d.rotulo).trim()));
  const sugs = SUGESTOES.filter(s => !usados.has(norm(s)));
  const nv = o.videos.filter(v => v.url.trim()).length;
  dr.style.setProperty("--st", `var(--s-${st.k})`);
  dr.innerHTML = `
    <div class="dr-top">
      <button class="icon-btn" type="button" data-acao="fechar" aria-label="Voltar ao cofre">${ic("voltar")}</button>
      <span class="dr-t" id="dr-t">${esc(o.nome || "Nova oferta")}</span>
      <span class="sync"><i></i><span class="sync-txt"></span></span>
    </div>
    <div class="dr-scroll">
      <div class="dr-inner">
        <div>
          <label class="sr" for="f-nome">Nome da oferta</label>
          <textarea id="f-nome" class="f-nome" data-f="nome" rows="1" placeholder="Nome da oferta">${esc(o.nome)}</textarea>
        </div>

        <div class="st-bloco">
          <div class="st-pick" role="radiogroup" aria-label="Situação da oferta">
            ${STATUS.map(s => `<button type="button" role="radio" aria-checked="${s.k === st.k}" data-status="${s.k}" style="--st:var(--s-${s.k})"><i></i>${esc(s.label)}</button>`).join("")}
          </div>
          <p class="st-hint">${esc(st.hint)}</p>
        </div>

        <div class="fields">
          <div class="field"><label for="f-nicho">Nicho</label><input class="input" id="f-nicho" data-f="nicho" value="${esc(o.nicho)}" placeholder="Crochê, papercraft, cerâmica…"></div>
          <div class="field"><label for="f-preco">Preço principal (R$)</label><input class="input mono" id="f-preco" data-f="preco" value="${esc(o.preco)}" placeholder="19,90" inputmode="decimal"></div>
          <div class="field"><label for="f-formato">Formato</label><input class="input" id="f-formato" data-f="formato" value="${esc(o.formato)}" placeholder="PDF, app, videoaulas…"></div>
        </div>

        <section class="blk">
          <header>${ic("link")}<h3>Links da oferta</h3></header>
          <div class="links">
            ${LINKS.map(l => {
              const href = linkSeguro(o[l.f]);
              return `<div class="field"><label for="f-${l.f}">${esc(l.label)}</label>
                <div class="comgo"><input class="input" id="f-${l.f}" data-f="${l.f}" value="${esc(o[l.f])}" placeholder="${esc(l.ph)}" inputmode="url">
                <a class="go" data-go="${l.f}" href="${esc(href || "#")}" target="_blank" rel="noopener noreferrer" ${href ? "" : "hidden"}>Abrir ↗</a></div></div>`;
            }).join("")}
          </div>
        </section>

        <section class="blk">
          <header>${ic("play")}<h3>Vídeos sobre o conteúdo</h3><span class="n">${nv}</span></header>
          <p class="sub">Aulas, referências, criativos de concorrente — o que ajudar a entender ou produzir o conteúdo.</p>
          <div class="vids">
            ${o.videos.length ? o.videos.map((v, i) => {
              const href = linkSeguro(v.url), p = plataforma(v.url);
              return `<div class="vid">
                <span class="plat ${p ? "" : "vazio"}">${esc(p || "link")}</span>
                <input class="input t" id="v-t-${i}" data-lista="videos" data-i="${i}" data-k="titulo" value="${esc(v.titulo)}" placeholder="Sobre o que é" aria-label="Título do vídeo ${i + 1}">
                <input class="input u" id="v-u-${i}" data-lista="videos" data-i="${i}" data-k="url" value="${esc(v.url)}" placeholder="Cole o link do vídeo" inputmode="url" aria-label="Link do vídeo ${i + 1}">
                <a class="go-s" href="${esc(href || "#")}" target="_blank" rel="noopener noreferrer" ${href ? "" : "hidden"}>Ver ↗</a>
                <button class="x" type="button" data-remover="videos" data-i="${i}" aria-label="Remover vídeo ${i + 1}">×</button>
              </div>`;
            }).join("") : `<p class="vazio-linha">Nenhum vídeo guardado ainda.</p>`}
          </div>
          <button class="btn add" type="button" data-acao="add-video">${ic("mais")}Adicionar vídeo</button>
        </section>

        <section class="blk">
          <header>${ic("grafico")}<h3>Dados e números</h3><span class="n">${o.dados.filter(d => d.valor.trim()).length}</span></header>
          <p class="sub">Os 3 primeiros aparecem no cartão da oferta.</p>
          <div class="dados">
            ${o.dados.length ? o.dados.map((d, i) => `
              <div class="dado">
                <input class="input" id="d-r-${i}" data-lista="dados" data-i="${i}" data-k="rotulo" value="${esc(d.rotulo)}" placeholder="O que é (ex.: CPA)" aria-label="Nome do dado ${i + 1}">
                <input class="input mono" id="d-v-${i}" data-lista="dados" data-i="${i}" data-k="valor" value="${esc(d.valor)}" placeholder="Valor" aria-label="Valor do dado ${i + 1}">
                <button class="x" type="button" data-remover="dados" data-i="${i}" aria-label="Remover dado ${i + 1}">×</button>
              </div>`).join("") : `<p class="vazio-linha">Sem números por enquanto. Use os atalhos abaixo ou crie o seu.</p>`}
          </div>
          <div class="sugs">
            ${sugs.length ? `<span class="cap">Adicionar</span>${sugs.map(s => `<button type="button" class="sug" data-sug="${esc(s)}">${esc(s)}</button>`).join("")}` : ""}
            <button type="button" class="sug" data-sug="">+ Outro dado</button>
          </div>
        </section>

        <section class="blk">
          <header>${ic("nota")}<h3>Informações</h3></header>
          <label class="sr" for="f-info">Informações da oferta</label>
          <textarea class="input f-info" id="f-info" data-f="info" placeholder="Promessa, público, o que tem no produto, bônus, o que funcionou e o que não funcionou nos testes…">${esc(o.info)}</textarea>
        </section>

        <footer class="dr-foot">
          <span>${o.criadoEm ? `criada ${esc(quando(o.criadoEm, true))} · atualizada ${esc(quando(o.atualizadoEm, true))}` : "ainda não salva — comece a preencher"}</span>
          ${S.ofertas.has(edit.id) ? `<button class="btn danger" type="button" data-acao="excluir">Excluir oferta</button>` : ""}
        </footer>
      </div>
    </div>`;
  crescer($("#f-nome")); crescer($("#f-info"), 220);
  const novoSc = dr.querySelector(".dr-scroll");
  novoSc.addEventListener("scroll", () => dr.classList.toggle("rolou", novoSc.scrollTop > 70), { passive:true });
  if (manterScroll) novoSc.scrollTop = top;
  dr.classList.toggle("rolou", novoSc.scrollTop > 70);
  atualizarSync();
}

function crescer(t, min){ if (!t) return; t.style.height = "auto"; t.style.height = Math.max(min || 0, t.scrollHeight + 2) + "px"; }
function tocar(){ salvar("ofertas", edit.id, edit.data); }

function fecharDrawer(){
  if (!edit) return;
  const o = edit.data, id = edit.id;
  const vLimpo = o.videos.filter(v => v.url.trim() || v.titulo.trim());
  const dLimpo = o.dados.filter(d => d.rotulo.trim() || d.valor.trim());
  const mudou = vLimpo.length !== o.videos.length || dLimpo.length !== o.dados.length;
  o.videos = vLimpo; o.dados = dLimpo;
  const temAlgo = ["nome","nicho","preco","formato","info", ...LINKS.map(l => l.f)].some(f => String(o[f] || "").trim()) || vLimpo.length || dLimpo.length;
  if (!temAlgo) { if (S.ofertas.has(id)) apagar("ofertas", id); }
  else if (S.ofertas.has(id)) { if (mudou) salvar("ofertas", id, o, 0); else salvarJa("ofertas", id); }
  edit = null;
  dr.hidden = true; dr.innerHTML = ""; dr.classList.remove("rolou"); $("#scrim").hidden = true;
  document.body.style.overflow = "";
  renderLogo();
  if (focoAntes && document.contains(focoAntes)) focoAntes.focus();
}

dr.addEventListener("input", e => {
  const t = e.target;
  if (!edit) return;
  if (t.dataset.f) {
    const f = t.dataset.f;
    edit.data[f] = t.value;
    if (f === "nome") { crescer(t); $("#dr-t").textContent = t.value || "Nova oferta"; }
    if (f === "info") crescer(t, 220);
    const go = dr.querySelector(`[data-go="${f}"]`);
    if (go) { const h = linkSeguro(t.value); go.hidden = !h; go.href = h || "#"; }
    tocar();
  } else if (t.dataset.lista) {
    const item = edit.data[t.dataset.lista][+t.dataset.i];
    if (!item) return;
    item[t.dataset.k] = t.value;
    if (t.dataset.lista === "videos" && t.dataset.k === "url") {
      const row = t.closest(".vid"), p = plataforma(t.value), h = linkSeguro(t.value);
      const pl = row.querySelector(".plat"); pl.textContent = p || "link"; pl.classList.toggle("vazio", !p);
      const go = row.querySelector(".go-s"); go.hidden = !h; go.href = h || "#";
    }
    tocar();
  }
});
dr.addEventListener("click", e => {
  if (!edit) return;
  const b = e.target.closest("button, a");
  if (!b) return;
  if (b.tagName === "A") { if (b.getAttribute("href") === "#") e.preventDefault(); return; }
  if (b.dataset.status) {
    edit.data.status = b.dataset.status; tocar(); renderDrawer(true);
    dr.querySelector(`[data-status="${b.dataset.status}"]`).focus();
    return;
  }
  if (b.dataset.remover) { edit.data[b.dataset.remover].splice(+b.dataset.i, 1); tocar(); renderDrawer(true); return; }
  if (b.dataset.sug !== undefined) {
    edit.data.dados.push({ rotulo:b.dataset.sug, valor:"" });
    renderDrawer(true);
    const i = edit.data.dados.length - 1;
    $(b.dataset.sug ? `#d-v-${i}` : `#d-r-${i}`).focus();
    return;
  }
  const a = b.dataset.acao;
  if (a === "fechar") fecharDrawer();
  else if (a === "add-video") {
    edit.data.videos.push({ titulo:"", url:"" });
    renderDrawer(true);
    $(`#v-u-${edit.data.videos.length - 1}`).focus();
  } else if (a === "excluir") {
    if (!b.classList.contains("armed")) {
      b.classList.add("armed"); b.textContent = "Toque de novo para excluir";
      setTimeout(() => { if (b.isConnected) { b.classList.remove("armed"); b.textContent = "Excluir oferta"; } }, 4000);
    } else {
      const id = edit.id;
      apagar("ofertas", id);
      for (const n of S.ideias.values()) if (n.virouOferta === id) salvar("ideias", n.id, { ...semId(n), virouOferta:null }, 0);
      edit.data = vazia("projeto"); edit.id = "__apagada";
      fecharDrawer();
    }
  }
});
$("#scrim").addEventListener("click", fecharDrawer);
document.addEventListener("keydown", e => { if (e.key === "Escape" && edit) { e.preventDefault(); fecharDrawer(); } });

function talvezAtualizarDrawer(){
  if (!edit || ocupado("ofertas", edit.id)) return;
  const fresca = S.ofertas.get(edit.id);
  if (!fresca) return;
  if (dr.contains(document.activeElement) && document.activeElement.matches("input, textarea")) return;
  if (fresca.atualizadoEm === edit.data.atualizadoEm) return;
  edit.data = paraEdicao(fresca);
  renderDrawer(true);
}

/* ---------------- ideias ---------------- */
function renderNotas(){
  const el = $("#notas");
  if (el.contains(document.activeElement) && document.activeElement.matches("input, textarea")) { notasPendentes = true; return; }
  notasPendentes = false;
  if (!carregado.ideias) { el.innerHTML = `<p class="poucos">Abrindo o cofre…</p>`; return; }
  if (!S.ideias.size) { el.innerHTML = `<p class="poucos">Nenhuma ideia guardada ainda. O bloco acima serve pra isso — o que for amadurecendo vira oferta com um toque.</p>`; return; }
  const q = norm(busca.ideias).trim();
  const lista = [...S.ideias.values()]
    .filter(n => !q || norm((n.titulo || "") + " " + (n.texto || "")).includes(q))
    .sort((a, b) => (b.fixada ? 1 : 0) - (a.fixada ? 1 : 0) || String(b.criadoEm).localeCompare(String(a.criadoEm)));
  if (!lista.length) { el.innerHTML = `<p class="poucos">Nada encontrado para “${esc(busca.ideias.trim())}”.</p>`; return; }
  el.innerHTML = lista.map(n => {
    const of = n.virouOferta && S.ofertas.get(n.virouOferta);
    const id = esc(n.id);
    return `
    <article class="nota ${n.fixada ? "fix" : ""}" data-id="${id}">
      ${n.fixada ? `<span class="fixo">${ic("pin")}Fixada</span>` : ""}
      <label class="sr" for="nt-${id}">Título</label>
      <input id="nt-${id}" data-nota="${id}" data-k="titulo" value="${esc(n.titulo || "")}" placeholder="Sem título" autocomplete="off">
      <label class="sr" for="n-${id}">Ideia</label>
      <textarea id="n-${id}" data-nota="${id}" data-k="texto" rows="1" placeholder="Escreva algo…">${esc(n.texto || "")}</textarea>
      <footer>
        <time datetime="${esc(n.criadoEm)}">${esc(quando(n.criadoEm, true))}</time>
        ${of ? `<button type="button" class="mini virou" data-acao="ver-oferta" title="${esc(of.nome)}">${ic("ofertas")}Virou oferta</button>`
             : `<button type="button" class="mini" data-acao="virar">${ic("transformar")}Virar oferta</button>`}
        <button type="button" class="mini ${n.fixada ? "on" : ""}" data-acao="fixar" aria-pressed="${!!n.fixada}">${ic("pin")}${n.fixada ? "Desafixar" : "Fixar"}</button>
        <button type="button" class="mini" data-acao="apagar-nota">Apagar</button>
      </footer>
    </article>`;
  }).join("");
  el.querySelectorAll("textarea").forEach(t => crescer(t));
}

function guardarIdeia(){
  const ti = $("#c-titulo"), tx = $("#nova-ideia");
  const titulo = ti.value.trim(), texto = tx.value.trim();
  if (!titulo && !texto) { tx.focus(); return; }
  salvar("ideias", uid(), { titulo, texto, fixada:false }, 0);
  ti.value = ""; tx.value = ""; tx.style.height = "";
  ti.focus();
  renderNotas();
}
$("#guardar").addEventListener("click", guardarIdeia);
[$("#nova-ideia"), $("#c-titulo")].forEach(el => el.addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); guardarIdeia(); }
  else if (e.key === "Enter" && el.id === "c-titulo") { e.preventDefault(); $("#nova-ideia").focus(); }
}));
$("#nova-ideia").addEventListener("input", e => crescer(e.target));

$("#notas").addEventListener("input", e => {
  const id = e.target.dataset.nota; if (!id) return;
  const n = S.ideias.get(id); if (!n) return;
  if (e.target.tagName === "TEXTAREA") crescer(e.target);
  salvar("ideias", id, { ...semId(n), [e.target.dataset.k]:e.target.value });
});
$("#notas").addEventListener("focusout", e => {
  const id = e.target.dataset && e.target.dataset.nota;
  setTimeout(() => {
    if (id) {
      const n = S.ideias.get(id);
      const aindaNela = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.nota === id;
      if (n && !aindaNela && !String(n.texto || "").trim() && !String(n.titulo || "").trim()) apagar("ideias", id);
      else salvarJa("ideias", id);
    }
    if (notasPendentes) renderNotas();
  }, 0);
});
$("#notas").addEventListener("click", e => {
  const b = e.target.closest("button[data-acao]"); if (!b) return;
  const id = b.closest(".nota").dataset.id, n = S.ideias.get(id); if (!n) return;
  const a = b.dataset.acao;
  if (a === "fixar") { salvar("ideias", id, { ...semId(n), fixada:!n.fixada }, 0); renderNotas(); }
  else if (a === "apagar-nota") {
    if (!b.classList.contains("armed")) {
      b.classList.add("armed"); b.textContent = "Confirmar";
      setTimeout(() => { if (b.isConnected) { b.classList.remove("armed"); b.textContent = "Apagar"; } }, 3500);
    } else { apagar("ideias", id); renderNotas(); }
  }
  else if (a === "ver-oferta") abrirOferta(n.virouOferta);
  else if (a === "virar") {
    const texto = String(n.texto || "").trim();
    const nome = (n.titulo || "").trim() || (texto.split("\n").find(l => l.trim()) || "").trim();
    const oid = uid();
    salvar("ofertas", oid, { ...vazia("projeto"), nome:nome.slice(0, 90), info:texto, origemIdeia:id }, 0);
    salvar("ideias", id, { ...semId(n), virouOferta:oid }, 0);
    renderNotas();
    abrirOferta(oid);
  }
});

/* ---------------- render ---------------- */
let raf = 0;
function renderLogo(){ if (raf) return; raf = requestAnimationFrame(() => { raf = 0; renderTudo(); }); }
function renderTudo(){
  renderNav();
  if (aba === "ofertas") renderGrupos(); else renderNotas();
  atualizarSync();
}

/* ---------------- dados: nuvem ou navegador ---------------- */
function aplicarSnap(col, snap){
  const m = new Map();
  for (const d of snap.docs) m.set(d.id, { ...d.data(), id:d.id });
  for (const [id, v] of S[col]) if (ocupado(col, id)) m.set(id, v);
  for (const p of pend.values()) if (p.col === col && p.data === null) m.delete(p.id);
  S[col] = m;
  if (!snap.metadata.fromCache || snap.size) carregado[col] = true;
  if (col === "ofertas") {
    talvezAtualizarDrawer();
    if (edit && !S.ofertas.has(edit.id) && edit.data.criadoEm && !ocupado("ofertas", edit.id)) fecharDrawer();
  }
  renderLogo();
}
function erroSnap(e){ ultimoErro = e || { code:"unavailable" }; atualizarSync(); }

function modoLocal(){
  modo = "local";
  for (const col of ["ofertas", "ideias"]) {
    try {
      const arr = JSON.parse(store.get("cofre." + col) || "[]");
      S[col] = new Map(arr.filter(x => x && x.id).map(x => [x.id, x]));
    } catch { S[col] = new Map(); }
    carregado[col] = true;
  }
  renderTudo();
}

async function iniciar(){
  irPara(aba);
  let ns = null;
  try { ns = window.claude && typeof window.claude.use === "function" ? await window.claude.use("db") : null; } catch { ns = null; }
  if (!ns) { modoLocal(); return; }
  db = ns; modo = "db";
  db.collection("ofertas").onSnapshot(s => aplicarSnap("ofertas", s), erroSnap);
  db.collection("ideias").onSnapshot(s => aplicarSnap("ideias", s), erroSnap);
  setTimeout(() => { if (!carregado.ofertas || !carregado.ideias) { carregado.ofertas = carregado.ideias = true; renderLogo(); } }, 5000);
  renderTudo();
}
iniciar();
})();
</script>
